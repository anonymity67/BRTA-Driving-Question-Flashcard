<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRTA Flashcards</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --mute:#667085; --line:#d8dce3;
          --ok:#1f8f4d; --bad:#c0392b; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151b; --card:#1b2029; --ink:#e8ebf0; --mute:#9aa3b2; --line:#2c3340; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans Bengali","Kalpurush",system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:10px; }
  .bar button, .bar select, .bar input {
    padding:8px 12px; font-size:14px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--ink); font-family:inherit; }
  .bar button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #stats { color:var(--mute); font-size:13px; margin-bottom:8px; text-align:center; }
  #card { width:100%; max-width:640px; min-height:260px; background:var(--card);
          border:1px solid var(--line); border-radius:14px; padding:22px; cursor:pointer;
          font-size:20px; line-height:1.7; white-space:pre-wrap; user-select:none;
          display:flex; flex-direction:column; justify-content:center; }
  #card .tag { font-size:12px; color:var(--mute); margin-bottom:10px; }
  #card.ans { border-color:var(--ok); }
  #card.ans .body { font-size:18px; }
  .hint { color:var(--mute); font-size:12px; margin-top:12px; }
  .nav { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; justify-content:center; }
  .nav button { padding:12px 18px; font-size:16px; border-radius:10px; border:1px solid var(--line);
                background:var(--card); color:var(--ink); cursor:pointer; font-family:inherit; }
  .nav .know { background:var(--ok); color:#fff; border-color:var(--ok); }
  .nav .dont { background:var(--bad); color:#fff; border-color:var(--bad); }
</style>
</head>
<body>
  <h1>BRTA লিখিত পরীক্ষা – ফ্ল্যাশকার্ড</h1>

  <div class="bar">
    <button id="mAll" class="on">সব</button>
    <button id="mMiss">যেগুলো ভুল</button>
    <button id="mNew">যেগুলো দেখিনি</button>
    <button id="shuf">শাফল</button>
    <input id="jump" type="number" min="1" placeholder="নং" style="width:80px">
    <button id="reset">রিসেট</button>
  </div>

  <div id="stats"></div>
  <div id="card"></div>

  <div class="nav"><button id="show" style="width:100%;max-width:640px;background:var(--accent);color:#fff;border-color:var(--accent)">👁 উত্তর দেখুন / Show answer</button></div>
  <div class="nav">
    <button id="prev">← আগের</button>
    <button id="dont" class="dont">ভুল / জানি না</button>
    <button id="know" class="know">জানি ✓</button>
    <button id="next">পরের →</button>
  </div>
  <div class="hint">কার্ডে ক্লিক করলে উত্তর দেখাবে &nbsp;|&nbsp; কীবোর্ড: Space = ফ্লিপ, ← → = আগের/পরের</div>

<script>
const CARDS = [
{n:1, q:`সুপরিকল্পিত ভাবে রাস্তায় যানবাহন পরিচালনার দায়িত্ব কোন কোন সংস্থার উপর ন্যাস্ত?`, a:`সুপরিকল্পিত ভাবে রাস্তায় যানবাহন পরিচালনার দায়িত্ব নিম্নে লিখিত সংস্থার উপর ন্যাস্ত-
ক) যোগাযোগ মন্ত্রণালয়
খ) সড়ক ও জনপথ বিভাগ
গ) ট্রাফিক পুলিশ বিভাগ
ঘ) সড়ক পরিবহন কর্তৃপক্ষ
ঙ) ড্রাইভিং প্রশিক্ষণ কেন্দ্র`},
{n:2, q:`রাস্তায় চলমান গাড়ীর কাগজপত্র পরির্দশন করার ক্ষমতা রাখেন কারা?`, a:`ক) পুলিশের সাব ইন্সপেক্টর, সার্জেন্ট ও উর্ধ্বতন কর্মকর্তা।
খ) বি.আর.টি.এ এর কর্মকর্তা।
গ) মোবাইল কোর্টের ম্যাজিষ্ট্রেট
ঘ) শুধুমাত্র উল্লেখিত প্রতিষ্ঠান/ব্যক্তি কাগজ পত্র পরির্দশন করবেন।`},
{n:3, q:`দুর্ঘটনা এড়াবার জন্য রাস্তা ব্যবহারকারীকে কি করতে হবে?`, a:`দুর্ঘটনা এড়াতে প্রত্যেক রাস্তা ব্যবহারকারীকে নিম্নের ৩টি বিষয় জানা প্রয়োজনঃ
ক) ট্রাফিক আইন জানতে হবে।
খ) ট্রাফিক আইন কার্যকরী করতে হবে।
গ) ট্রাফিক আইন কার্যকরী করবার সদিচ্ছা থাকতে হবে।`},
{n:4, q:`নিরাপদ ভ্রমনের জন্য ইঞ্জিন ষ্টার্ট করে পাঁচ থেকে দশ (৫-১০) গজের মধ্যে অবশ্যই কি চেক করতে হয়?`, a:`ব্রেক প্যাডেলে চাপ প্রয়োগ করে ব্রেকের কার্যক্ষমতা।`},
{n:5, q:`নিরাপদ দূরত্ব বজায় রাখার সাধারণ নিয়ম কি কি?`, a:`ক) গতি যত মাইল তত গজ দূরত্ব বজায় রাখা।
খ) গতি যত কিঃ মিঃ তত মিটারের অর্ধেক মিটার অথবা দুই সেকেন্ড সময়ের দূরত্ব বজায় রাখা।`},
{n:6, q:`গতি কিসের উপর নির্ভর করে?`, a:`গতি সাধারনত নির্ভর করে- দৃষ্টিগোচরতার উপর / আবহাওয়ার পরিস্থিতির উপর / যানবাহনের উপর / গাড়ীর অবস্থার উপর / রাস্তার উপর / চালকের উপর।`},
{n:7, q:`গাড়ী দাঁড় করাতে চালক কিভাবে হাতের সংকেত দিবে?`, a:`হাত বের করে এলবো জয়েন্ট হতে হাত ৯০° বেন্ট (Bent) করে উপরের দিকে উঠাবে।`},
{n:8, q:`ডান দিকের লেন সব সময় কারা ব্যবহার করবেন?`, a:`ওভারটেক করা গাড়ী।`},
{n:9, q:`রাস্তার মাঝখানের অখন্ডিত ডাবল হলুদ লাইন-এর অর্থ কি?`, a:`আইল্যান্ড।`},
{n:10, q:`মাঝখানের অখন্ডিত সাদা লাইন এর অর্থ কি?`, a:`ওভারটেক করা যাবে না।`},
{n:11, q:`ছোট ছোট বিভক্ত সাদা লাইন এর অর্থ কি?`, a:`ওভারটেক করা যাবে।`},
{n:12, q:`কোন কোন গাড়ী ট্রাফিক নিয়ম ভঙ্গ করতে পারেন?`, a:`জরুরী কাজে নিয়োজিত গাড়ী: ভিআইপি গাড়ী / অগ্নিনির্বাপক গাড়ী / এম্বুলেন্স ট্রাফিক নিয়ম ভঙ্গ করতে পারেন।`},
{n:13, q:`জরুরী গাড়ী কি ধরনের সিগন্যাল ব্যবহার করেন?`, a:`ক) ভিআইপি গাড়ীঃ লাল বাতি ও সর্তক সংকেত ব্যবহার করেন।
খ) অগ্নিনির্বাপক গাড়ীঃ লাল-নীল বাতি ও বেল বাজিয়ে থাকেন।
গ) এম্বুলেন্সঃ লাল-নীল বাতি ও আলাদা হর্ন (সাইরেন) ব্যবহার করেন।`},
{n:14, q:`জরুরী গাড়ীকে অন্যান্য যানবাহন কি ভাবে সুযোগ দিয়ে থাকে?`, a:`অন্যান্য যানবাহন চালকদের উচিত হবে যতটুকু সম্ভব রাস্তার বামে গিয়ে দাঁড়িয়ে থাকা।`},
{n:15, q:`ইন্টারসেকশন কাকে বলে?`, a:`একাধিক রাস্তার মিলিত স্থানকে ইন্টারসেকশন বলে।`},
{n:16, q:`ইন্টারসেকশনে ঢুকার আগে চালকের কি করণীয়?`, a:`গতি কম করা / নিম্ন গিয়ার ব্যবহার করা / নিজের রাস্তায় থাকা, প্রয়োজনে থামা তারপর সর্তকতার সাথে যাওয়ার চেষ্টা করা।`},
{n:17, q:`ইন্টারসেকশনে ঢুকার পরে কি করণীয়?`, a:`সর্তকতার সাথে থামাতে প্রস্তুত থেকে অগ্রসর হওয়া।`},
{n:18, q:`ডান দিকে মোড় নিতে গেলে লাল বাতি জ্বলে উঠলে গাড়ী রাস্তার কোন পাশে দাঁড় করাবেন?`, a:`রাস্তার ডান পার্শ্বে।`},
{n:19, q:`লাল বাতি শেষে সবুজ বাতি জ্বলে গেলে কোন পথের গাড়ী আগে সুযোগ পাবে?`, a:`সোজা যাওয়ার গাড়ী আগে সুযোগ পাবে।`},
{n:20, q:`অরক্ষিত লেভেল ক্রসিং সাধারনত কোথায় থাকে?`, a:`গ্রাম অঞ্চলে যেখানে সারাদিনে ২-৩টি ট্রেন চলাচল করে।`},
{n:21, q:`কোন কোন স্থানে হর্ন বাজানো নিষেধ?`, a:`যেখানে হর্ণ বাজানো নিষেধ বোর্ড আছে। হাসপাতাল এলাকা / আবাসিক এলাকা / আদালত / কোর্ট ভবন / শিক্ষা প্রতিষ্ঠান / উপাসনালয়।`},
{n:22, q:`ওভারটেকিং এর সময়ে দুর্ঘটনা এড়ানোর উপায় কি?`, a:`দর্শন আয়নার সাহায্যে পিছনের গাড়ীর গতি বিধি লক্ষ্য করা।`},
{n:23, q:`ওভারটেক করার পূর্বে চালকের কর্তব্য কি?`, a:`দর্শন আয়নার সাহায্যে / ডানদিকের রাস্তা নিরাপদ কিনা লক্ষ্য রাখা / সম্মুখ হতে কোন গাড়ী আসছে কিনা দেখে নিরাপদ মনে করলে ইন্ডিকেটর দিয়ে ওভারটেক করা।`},
{n:24, q:`গাড়ীর সাধারণত স্কিডিং কোথায় হয়ে থাকে?`, a:`ভিজা রাস্তায় অতি দ্রুত চালালে, সকল হুইল সিলিন্ডার ব্রেক সমান ভাবে কাজ না করলে, রাস্তা পিচ্ছিল বা কর্দমাক্ত হলে, রাস্তায় বরফ বা ঘাস থাকলে।`},
{n:25, q:`গাড়ী স্কিডিং করলে চালকের করণীয় কি?`, a:`এক্সিলারেটর প্যাডেল হতে পা উঠিয়ে গতি কমাবে। যে দিকে স্কিড করেছে সেই দিকে আস্তে স্টিয়ারিং কাটলে/ঘুরালে পিছনের অংশ স্কিডিং এর দিকে যাবে এবং সামনের অংশ এগিয়ে নিরাপদ স্থানে ঘুরে আসবে। তারপর গাড়ীর গতি সর্বনিম্ন হলে ব্রেক দিয়ে থামাবেন।`},
{n:26, q:`একজন যাত্রীর শ্বাস প্রশ্বাসে কষ্ট হলে চালক/কন্ডাক্টারের দায়িত্ব কি?`, a:`উক্ত ব্যক্তির মুখে মুখ লাগিয়ে শ্বাস দিবে এবং বুকে মৃদু চাপ প্রয়োগ করবে এবং পরে নিকটতম হাসপাতালে নিতে হবে।`},
{n:27, q:`ইঞ্জিন ঠান্ডা রাখে কিভাবে?`, a:`বাতাস বা পানির সাহায্যে।`},
{n:28, q:`গরম রেডিয়েটরে ঠান্ডা পানি ঢাললে ইঞ্জিনের কি ক্ষতি হতে পারে?`, a:`ইঞ্জিন ব্লক ক্রেক হওয়ার সম্ভাবনা থাকে।`},
{n:29, q:`রেডিয়েটরের সাথে কয়টি হোজ পাইপ সংযুক্ত থাকে?`, a:`দুইটি হোজ পাইপ থাকে।`},
{n:30, q:`কি কি কারণে ইঞ্জিন বন্ধ হয় বা ষ্টার্ট হয় না?`, a:`ট্যাংকে ফুয়েল না থাকলে / ডিজেল পাইপে বাতাস ঢুকলে / পেট্রোল ইঞ্জিনের এইচ.টি তার বা এলটি তার লুজ হলে বা ছিঁড়ে গেলে / ব্যাটারী চার্জ দূর্বল হলে।`},
{n:31, q:`স্কিডিং সাধারনতঃ কত প্রকার?`, a:`স্কিডিং সাধারনতঃ ৩ প্রকারঃ
ক) সামনের দুই চাকার স্কিডিং।
খ) পিছনের দুই চাকার স্কিডিং।
গ) চার চাকার স্কিডিং।`},
{n:32, q:`রাস্তায় গাড়ী চলতে চলতে হঠাৎ বন্ধ হওয়ার কারণ কি?`, a:`রাস্তায় গাড়ী চলতে চলতে হঠাৎ বন্ধ হওয়ার কারণ হলঃ
ক) গাড়ীতে জ্বালানি না থাকা।
খ) স্পার্ক প্লাগ খারাপ হওয়া।`},
{n:33, q:`শক এবজরভারের কাজ কি?`, a:`শক এবজরভারের কাজ হল গাড়ীর ঝাকুনি কমানো।`},
{n:34, q:`রাস্তায় গাড়ী বের করার পূর্বে গাড়ীর কোন কোন অংশ পরিদর্শন করতে হয়?`, a:`ক) জ্বালানী (পেট্রোল, ডিজেল ও অকটেন)।
খ) লুব অয়েল।
গ) রেডিয়েটরের পানির পরিমান।
ঘ) ব্রেক মাষ্টার সিলিন্ডারের ব্রেক ফ্লুইড।
ঙ) চাকার হাওয়ার পরিমান।
চ) চাকার নাট-বোল্ট সঠিক ভাবে আটকানো আছে কিনা।
ছ) ব্রেক সঠিক ভাবে কাজ করে কিনা।`},
{n:35, q:`পেট্রোল ইঞ্জিনে ভেপার লক বলতে কি বুঝ?`, a:`সাধারণত ফুয়েল লাইন অত্যাধিক তাপের ফলে লাইনের ভিতর ভেপার বা বাষ্পের সৃষ্টি হয়। এই বাষ্পের চাপে লাইনের ভিতর জ্বালানী সরবরাহ বন্ধ হওয়াকে ভেপার লক বলে।`},
{n:36, q:`ডিজেল ইঞ্জিনে এয়ার লক হয় কিভাবে?`, a:`ডিজেল ইঞ্জিনের জ্বালানি সরবারহ লাইনে কোন ভাবে বাতাস প্রবেশ করলে এয়ার লক হয়। কিন্তু পাম্পের সাহায্যে পাম্প করে এয়ার ব্লিডিং স্ক্রু লুজ করে বাতাস বের করে এয়ার লক দূর করা যায়।`},
{n:37, q:`কি কি লক্ষণ দেখা দিলে ইঞ্জিন ওভার হলিং করা প্রয়োজন?`, a:`ক) ইঞ্জিনে জ্বালানি এবং লুব-ওয়েল বেশী খরচ হলে।
খ) অত্যাধিক কালো ধোয়া ছাড়লে।
গ) বোঝা বহন ক্ষমতা কমে গেলে।
ঘ) ইঞ্জিনের কম্প্রেশন দুর্বল হলে।`},
{n:38, q:`ডিজেল ইঞ্জিন হঠাৎ বন্ধ হয়ে যাওয়ার সম্ভাব্য কারণ কি?`, a:`১। ট্যাংকে ফুয়েল নেই।
২। ফুয়েল পাম্প অকেজো।
৩। ইনটেক ও এগজষ্ট ভাল্ব কাজ করে না।
৪। গর্ভনর অকেজো।
৫। পিষ্টন ও বিয়ারিং জাম।`},
{n:39, q:`মোটরযান কাকে বলে?`, a:`মোটরযান আইনে মোটরযান অর্থ কোনো যন্ত্রচালিত যান, যার চালিকাশক্তি বাইরের বা ভিতরের কোনো উৎস হতে সরবরাহ হয়ে থাকে।`},
{n:40, q:`গাড়ি চালনার আগে করণীয় কাজ কী কী?`, a:`ক. গাড়ির হালনাগাদ বৈধ কাগজপত্র (রেজিস্ট্রেশন সার্টিফিকেট, ফিটনেস সার্টিফিকেট, ট্যাক্সটোকেন, ড্রাইভিং লাইসেন্স, ইন্সুরেন্স (বিমা) সার্টিফিকেট, রুট পারমিট ইত্যাদি) গাড়ির সঙ্গে রাখা।
খ. গাড়িতে জ্বালানি আছে কি না পরীক্ষা করা, না থাকলে পরিমাণ মতো নেওয়া।
গ. রেডিয়েটর ও ব্যাটারিতে পানি আছে কি না পরীক্ষা করা, না থাকলে পরিমাণ মতো নেওয়া।
ঘ. ব্যাটারি কানেকশন পরীক্ষা করা।
ঙ. লুব/ইঞ্জিন অয়েলের লেবেল ও ঘনত্ব পরীক্ষা করা, কম থাকলে পরিমাণ মতো নেওয়া।
চ. মাস্টার সিলিন্ডারের ব্রেকফ্লুইড, ব্রেকঅয়েল পরীক্ষা করা, কম থাকলে নেওয়া।
ছ. গাড়ির ইঞ্জিন, লাইটিং সিস্টেম, ব্যাটারি, স্টিয়ারিং ইত্যাদি সঠিকভাবে কাজ করছে কি না, নাট-বোল্ট টাইট আছে কি না অর্থাৎ সার্বিকভাবে মোটরযানটি ত্রুটিমুক্ত আছে কি না পরীক্ষা করা।
জ. ব্রেক ও ক্লাচের কার্যকারিতা পরীক্ষা করা।
ঝ. অগ্নিনির্বাপক যন্ত্র এবং ফাস্টএইড বক্স গাড়িতে রাখা।
ঞ. গাড়ির বাইরের এবং ভিতরের বাতির অবস্থা, চাকা (টায়ার কন্ডিশন/হাওয়া/নাট/এলাইমেন্ট/রোটেশন/স্পেয়ার চাকা) পরীক্ষা করা।`},
{n:41, q:`মোটরযানের মেইনটেনেন্স বা রক্ষণাবেক্ষণ বলতে কী বুঝায়?`, a:`ত্রুটিমুক্ত অবস্থায় একটি গাড়ি হতে দীর্ঘদিন সার্ভিস পাওয়ার জন্য প্রতিদিন গাড়িতে যে সমস্ত মেরামত কাজ করা হয়, তাকে মোটরযানের মেইনটেনেন্স বলে।`},
{n:42, q:`একটি মোটরযানে প্রতিদিন কী কী মেইনটেনেন্স করতে হয়?`, a:`৪০ নং প্রশ্নের উত্তরের (খ) থেকে (ঞ) পর্যন্ত:
খ. জ্বালানি পরীক্ষা
গ. রেডিয়েটর ও ব্যাটারির পানি পরীক্ষা
ঘ. ব্যাটারি কানেকশন পরীক্ষা
ঙ. লুব/ইঞ্জিন অয়েলের লেবেল ও ঘনত্ব পরীক্ষা
চ. মাস্টার সিলিন্ডারের ব্রেকফ্লুইড/ব্রেকঅয়েল পরীক্ষা
ছ. ইঞ্জিন, লাইটিং সিস্টেম, ব্যাটারি, স্টিয়ারিং, নাট-বোল্ট পরীক্ষা
জ. ব্রেক ও ক্লাচের কার্যকারিতা পরীক্ষা
ঝ. অগ্নিনির্বাপক যন্ত্র ও ফাস্টএইড বক্স রাখা
ঞ. বাতি ও চাকা (টায়ার কন্ডিশন/হাওয়া/নাট/এলাইমেন্ট/রোটেশন/স্পেয়ার চাকা) পরীক্ষা`},
{n:43, q:`সার্ভিসিং বলতে কী বুঝায়?`, a:`মোটরযানের ইঞ্জিন ও বিভিন্ন যন্ত্রাংশের কার্যক্ষমতাকে দীর্ঘস্থায়ী করার জন্য নির্দিষ্ট সময় পরপর যে কাজগুলো করা হয়, তাকে সার্ভিসিং বলে।`},
{n:44, q:`গাড়ি সার্ভিসিংয়ে কী কী কাজ করা হয়?`, a:`ক. ইঞ্জিনের পুরাতন লুবঅয়েল (মবিল) ফেলে দিয়ে নতুন লুবঅয়েল দেওয়া। নতুন লুবঅয়েল দেওয়ার আগে ফ্লাশিং অয়েল দ্বারা ফ্লাশ করা।
খ. ইঞ্জিন ও রেডিয়েটরের পানি ড্রেন আউট করে ডিটারজেন্ট ও ফ্লাশিংগান দিয়ে পরিষ্কার করা, অতঃপর পরিষ্কার পানি দিয়ে পূর্ণ করা।
গ. ভারী মোটরযানের ক্ষেত্রে বিভিন্ন গ্রিজিং পয়েন্টে গ্রিজগান দিয়ে নতুন গ্রিজ দেওয়া।
ঘ. গাড়ির স্পেয়ার হুইলসহ প্রতিটি চাকাতে পরিমাণমতো হাওয়া দেওয়া।
ঙ. লুবঅয়েল (মবিল) ফিল্টার, ফুয়েল ফিল্টার ও এয়ারক্লিনার পরিবর্তন করা।`},
{n:45, q:`গাড়ি চালনাকালে কী কী কাগজপত্র গাড়ির সঙ্গে রাখতে হয়?`, a:`ক. ড্রাইভিং লাইসেন্স
খ. রেজিস্ট্রেশন সার্টিফিকেট (ব্লু-বুক)
গ. ট্যাক্সটোকেন
ঘ. ইন্সুরেন্স সার্টিফিকেট
ঙ. ফিটনেস সার্টিফিকেট (মোটরসাইকেলের ক্ষেত্রে প্রযোজ্য নয়)
চ. রুটপারমিট (মোটরসাইকেল এবং চালক ব্যতীত সর্বোচ্চ ৭ আসন বিশিষ্ট ব্যক্তিগত যাত্রীবাহী গাড়ির ক্ষেত্রে প্রযোজ্য নয়)।`},
{n:46, q:`রাস্তায় গাড়ির কাগজপত্র কে কে চেক করতে পারেন / কোন কোন ক্ষমতাপ্রাপ্ত ব্যক্তিগণকে গাড়ির কাগজ দেখাতে বাধ্য?`, a:`সার্জেন্ট বা সাব-ইনসপেক্টরের নিচে নয় এমন পুলিশ কর্মকর্তা, মোটরযান পরিদর্শকসহ বিআরটিএর কর্মকর্তা এবং মোবাইলকোর্টের কর্মকর্তা।`},
{n:47, q:`মোটরসাইকেলে হেলমেট পরিধান ও আরোহী বহন সম্পর্কে আইন কী?`, a:`মোটরসাইকেলে চালক ব্যতীত ১ জন আরোহী বহন করা যাবে এবং উভয়কেই হেলমেট পরিধান করতে হবে (মোটরযান অধ্যাদেশ, ১৯৮৩ এর ধারা-১০০)।`},
{n:48, q:`সড়ক দুর্ঘটনার প্রধান কারণ কী কী?`, a:`ক. অত্যধিক আত্মবিশ্বাস,
খ. মাত্রাতিরিক্ত গতিতে গাড়ি চালানো,
গ. অননুমোদিত ওভারটেকিং এবং
ঘ. অতিরিক্ত যাত্রী ও মালামাল বহন।`},
{n:49, q:`গাড়ি দুর্ঘটনায় পতিত হলে চালকের করণীয় কী?`, a:`আহত ব্যক্তির চিকিৎসা নিশ্চিত করা, প্রয়োজনে নিকটস্থ হাসপাতালে স্থানান্তর করা এবং ২৪ ঘণ্টার মধ্যে নিকটবর্তী থানায় দুর্ঘটনার বিষয়ে রিপোর্ট করা।`},
{n:50, q:`আইন অনুযায়ী গাড়ির সর্বোচ্চ গতিসীমা কত?`, a:`হালকা মোটরযান ও মোটরসাইকেলের ক্ষেত্রে ঘণ্টায় সর্বোচ্চ ৭০ মাইল, মাঝারি বা ভারী যাত্রীবাহী মোটরযানের ক্ষেত্রে ঘণ্টায় সর্বোচ্চ ৩৫ মাইল এবং মাঝারি বা ভারী মালবাহী মোটরযানের ক্ষেত্রে ঘণ্টায় সর্বোচ্চ ৩০ মাইল।`},
{n:51, q:`মোটর ড্রাইভিং লাইসেন্স কী?`, a:`সর্বসাধারণের ব্যবহার্য স্থানে মোটরযান চালানোর জন্য লাইসেন্স কর্তৃপক্ষ কর্তৃক ইস্যুকৃত বৈধ দলিলই মোটর ড্রাইভিং লাইসেন্স।`},
{n:52, q:`অপেশাদার ড্রাইভিং লাইসেন্স কাকে বলে?`, a:`যে লাইসেন্স দিয়ে একজন চালক কারও বেতনভোগী কর্মচারী না হয়ে মোটর সাইকেল, হালকা মোটরযান এবং অন্যান্য মোটরযান (পরিবহনযান ব্যতীত) চালাতে পারে, তাকে অপেশাদার ড্রাইভিং লাইসেন্স বলে।`},
{n:53, q:`ড্রাইভিং লাইসেন্স পাওয়ার ক্ষেত্রে সর্বনিম্ন বয়স কত?`, a:`পেশাদার চালকের ক্ষেত্রে ২০ বছর এবং অপেশাদার চালকের ক্ষেত্রে ১৮ বছর।`},
{n:54, q:`কোন কোন ব্যক্তি ড্রাইভিং লাইসেন্স পাওয়ার অযোগ্য বলে বিবেচিত হবে?`, a:`মৃগীরোগী, উন্মাদ বা পাগল, রাতকানারোগী, কুষ্ঠরোগী, হৃদরোগী, অতিরিক্ত মদ্যপব্যক্তি, বধিরব্যক্তি এবং বাহু বা পা চলাচল নিয়ন্ত্রণ করতে অসুবিধা হয় এমন ব্যক্তি।`},
{n:55, q:`হালকা মোটরযান কাকে বলে?`, a:`যে মোটরযানের রেজিস্ট্রিকৃত বোঝাই/ওজন ৬,০০০ পাউন্ড বা ২,৭২৭ কেজির অধিক নয়, তাকে হালকা মোটরযান বলে।`},
{n:56, q:`মধ্যম বা মাঝারি মোটরযান কাকে বলে?`, a:`যে মোটরযানের রেজিস্ট্রিকৃত বোঝাই/ওজন ৬,০০০ পাউন্ড বা ২,৭২৭ কেজির অধিক কিন্তু ১৪,৫০০ পাউন্ড বা ৬,৫৯০ কেজির অধিক নয়, তাকে মধ্যম বা মাঝারি মোটরযান বলে।`},
{n:57, q:`ভারী মোটরযান কাকে বলে?`, a:`যে মোটরযানের রেজিস্ট্রিকৃত বোঝাই/ওজন ১৪,৫০০ পাউন্ড বা ৬,৫৯০ কেজির অধিক, তাকে ভারী মোটরযান বলে।`},
{n:58, q:`প্রাইভেট সার্ভিস মোটরযান (private service vehicle) কাকে বলে?`, a:`ড্রাইভার ব্যতীত আটজনের বেশি যাত্রী বহনের উপযোগী যে মোটরযান মালিকের পক্ষে তার ব্যবসা সম্পর্কিত কাজে এবং বিনা ভাড়ায় যাত্রী বহনের জন্য ব্যবহৃত হয়, তাকে প্রাইভেট সার্ভিস মোটরযান বলে।`},
{n:59, q:`ট্রাফিক সাইন বা রোড সাইন (চিহ্ন) প্রধানত কত প্রকার ও কী কী?`, a:`ট্রাফিক সাইন বা চিহ্ন প্রধানত তিন প্রকার।
ক. বাধ্যতামূলক, যা প্রধানত বৃত্তাকৃতির হয়,
খ. সতর্কতামূলক, যা প্রধানত ত্রিভুজাকৃতির হয় এবং
গ. তথ্যমূলক, যা প্রধানত আয়তক্ষেত্রাকার হয়।`},
{n:60, q:`লাল বৃত্তাকার সাইন কী নির্দেশনা প্রদর্শন করে?`, a:`নিষেধ বা করা যাবে না বা অবশ্য বর্জনীয় নির্দেশনা প্রদর্শন করে।`},
{n:61, q:`নীল বৃত্তাকার সাইন কী নির্দেশনা প্রদর্শন করে?`, a:`করতে হবে বা অবশ্য পালনীয় নির্দেশনা প্রদর্শন করে।`},
{n:62, q:`লাল ত্রিভুজাকৃতির সাইন কী নির্দেশনা প্রদর্শন করে?`, a:`সতর্ক হওয়ার নির্দেশনা প্রদর্শন করে।`},
{n:63, q:`নীল রঙের আয়তক্ষেত্র কোন ধরনের সাইন?`, a:`সাধারণ তথ্যমূলক সাইন।`},
{n:64, q:`সবুজ রঙের আয়তক্ষেত্র কোন ধরনের সাইন?`, a:`পথনির্দেশক তথ্যমূলক সাইন, যা জাতীয় মহাসড়কে ব্যবহৃত হয়।`},
{n:65, q:`কালো বর্ডারের সাদা রঙের আয়তক্ষেত্র কোন ধরনের সাইন?`, a:`এটিও পথনির্দেশক তথ্যমূলক সাইন, যা মহাসড়ক ব্যতীত অন্যান্য সড়কে ব্যবহৃত হয়।`},
{n:66, q:`ট্রাফিক সিগন্যাল বা সংকেত কত প্রকার ও কী কী?`, a:`৩ (তিন) প্রকার। যেমনঃ (ক) বাহুর সংকেত, (খ) আলোর সংকেত ও (গ) শব্দ সংকেত।`},
{n:67, q:`ট্রাফিক লাইট সিগন্যালের চক্র বা অনুক্রম (sequence) গুলি কী কী?`, a:`লাল-সবুজ-হলুদ এবং পুনরায় লাল।`},
{n:68, q:`লাল, সবুজ ও হলুদ বাতি কী নির্দেশনা প্রদর্শন করে?`, a:`লালবাতি জ্বললে গাড়িকে থামুন লাইনের পেছনে থামিয়ে অপেক্ষা করতে হবে, সবুজবাতি জ্বললে গাড়ি নিয়ে অগ্রসর হওয়া যাবে এবং হলুদবাতি জ্বললে গাড়িকে থামানোর জন্য প্রস্তুতি নিতে হবে।`},
{n:69, q:`নিরাপদ দূরত্ব বলতে কী বুঝায়?`, a:`সামনের গাড়ির সাথে সংঘর্ষ এড়াতে পেছনের গাড়িকে নিরাপদে থামানোর জন্য যে পরিমাণ দূরত্ব বজায় রেখে গাড়ি চালাতে হয় সেই পরিমাণ দূরত্বকে নিরাপদ দূরত্ব বলে।`},
{n:70, q:`পাহাড়ি ও ঢাল/চূড়ায় রাস্তায় গাড়ি কোন গিয়ারে চালাতে হয়?`, a:`ফার্স্ট গিয়ারে। কারণ ফার্স্ট গিয়ারে গাড়ি চালানোর জন্য ইঞ্জিনের শক্তি বেশি প্রয়োজন হয়।`},
{n:71, q:`পাকা ও ভালো রাস্তায় ৫০ মাইল গতিতে গাড়ি চললে নিরাপদ দূরত্ব কত হবে?`, a:`৫০ গজ বা ১৫০ ফুট।`},
{n:72, q:`লাল বৃত্তে ৫০ কি.মি. লেখা থাকলে কী বুঝায়?`, a:`গাড়ির সর্বোচ্চ গতিসীমা ঘণ্টায় ৫০ কি.মি. অর্থাৎ ঘণ্টায় ৫০ কিলোমিটারের বেশি গতিতে গাড়ি চালানো যাবে না।`},
{n:73, q:`নীল বৃত্তে ঘণ্টায় ৫০ কি.মি. লেখা থাকলে কী বুঝায়?`, a:`সর্বনিম্ন গতিসীমা ঘণ্টায় ৫০ কি.মি. অর্থাৎ ঘণ্টায় ৫০ কিলোমিটারের কম গতিতে গাড়ি চালানো যাবে না।`},
{n:74, q:`লাল বৃত্তের মধ্যে হর্ন আঁকা থাকলে কী বুঝায়?`, a:`হর্ন বাজানো নিষেধ।`},
{n:75, q:`লাল বৃত্তের ভিতরে একটি বড় বাসের ছবি থাকলে কী বুঝায়?`, a:`বড় বাস প্রবেশ নিষেধ।`},
{n:76, q:`লাল বৃত্তে একজন চলমান মানুষের ছবি আঁকা থাকলে কী বুঝায়?`, a:`পথচারী পারাপার নিষেধ।`},
{n:77, q:`লাল ত্রিভুজে একজন চলমান মানুষের ছবি আঁকা থাকলে কী বুঝায়?`, a:`সামনে পথচারী পারাপার, তাই সাবধান হতে হবে।`},
{n:78, q:`লাল বৃত্তের ভিতর একটি লাল ও একটি কালো গাড়ি থাকলে কী বুঝায়?`, a:`ওভারটেকিং নিষেধ।`},
{n:79, q:`আয়তক্ষেত্রে 'P' লেখা থাকলে কী বুঝায়?`, a:`পার্কিংয়ের জন্য নির্ধারিত স্থান।`},
{n:80, q:`কোন কোন স্থানে গাড়ির হর্ন বাজানো নিষেধ?`, a:`নীরব এলাকায় গাড়ির হর্ন বাজানো নিষেধ। হাসপাতাল, শিক্ষাপ্রতিষ্ঠান, অফিস-আদালত, উপাসনালয় বা অনুরূপ প্রতিষ্ঠানসমূহের চতুর্দিকে ১০০ মিটার পর্যন্ত এলাকা নীরব এলাকা হিসাবে চিহ্নিত।`},
{n:81, q:`কোন কোন স্থানে ওভারটেক করা নিষেধ?`, a:`(ক) ওভারটেকিং নিষেধ সম্বলিত সাইন থাকে এমন স্থানে,
(খ) জাংশনে,
(গ) ব্রিজ/কালভার্ট ও তার আগে পরে নির্দিষ্ট দূরত্ব,
(ঘ) সরু রাস্তায়,
(ঙ) হাসপাতাল ও শিক্ষা প্রতিষ্ঠান এলাকায়।`},
{n:82, q:`কোন কোন স্থানে গাড়ি পার্ক করা নিষেধ?`, a:`(ক) যেখানে পার্কিং নিষেধ বোর্ড আছে এমন স্থানে,
(খ) জাংশনে,
(গ) ব্রিজ বা কালভার্টের ওপর,
(ঘ) সরু রাস্তায়,
(ঙ) হাসপাতাল ও শিক্ষা প্রতিষ্ঠান এলাকায়,
(চ) পাহাড়ের ঢালে ও ঢালু রাস্তায়, ফুটপাত, পথচারী পারাপার এবং তার আশেপাশে,
(ছ) বাস স্টপেজ ও তার আশেপাশে,
(জ) রেলক্রসিং ও তার আশেপাশে।`},
{n:83, q:`গাড়ি রাস্তার কোন পাশ দিয়ে চলাচল করবে?`, a:`গাড়ি রাস্তার বামপাশ দিয়ে চলাচল করবে। যে রাস্তায় একাধিক লেন থাকবে সেখানে বামপাশের লেনে ধীর গতির গাড়ি, আর ডানপাশের লেনে দ্রুত গতির গাড়ি চলাচল করবে।`},
{n:84, q:`কখন বামদিক দিয়ে ওভারটেক করা যায়?`, a:`যখন সামনের গাড়ি চালক ডানদিকে মোড় নেওয়ার ইচ্ছায় যথাযথ সংকেত দিয়ে রাস্তার মাঝামাঝি স্থানে যেতে থাকবেন তখনই পেছনের গাড়ির চালক বামদিক দিয়ে ওভারটেক করবেন।`},
{n:85, q:`চলন্ত অবস্থায় সামনের গাড়িকে অনুসরণ করার সময় কী কী বিষয় লক্ষ্য রাখা উচিত?`, a:`(ক) সামনের গাড়ির গতি (স্পিড) ও গতিবিধি,
(খ) সামনের গাড়ি থামার সংকেত দিচ্ছে কি না,
(গ) সামনের গাড়ি ডানে/বামে ঘুরার সংকেত দিচ্ছে কি না,
(ঘ) সামনের গাড়ি হতে নিরাপদ দূরত্ব বজায় থাকছে কি না।`},
{n:86, q:`রাস্তার পাশে সতর্কতামূলক "স্কুল/শিশু" সাইন বোর্ড থাকলে চালকের করণীয় কী?`, a:`(ক) গাড়ির গতি কমিয়ে রাস্তার দু-পাশে ভালো ভাবে দেখে-শুনে সতর্কতার সাথে অগ্রসর হতে হবে।
(খ) রাস্তা পারাপারের অপেক্ষায় কোনো শিশু থাকলে তাকে অগ্রাধিকার দিতে হবে।`},
{n:87, q:`গাড়ির গতি কমানোর জন্য চালক হাত দিয়ে কীভাবে সংকেত দিবেন?`, a:`চালক তার ডানহাত গাড়ির জানালা দিয়ে সোজাসুজি বের করে ধীরে ধীরে উপরে-নীচে উঠানামা করাতে থাকবেন।`},
{n:88, q:`লেভেলক্রসিং বা রেলক্রসিং কত প্রকার ও কী কী?`, a:`লেভেলক্রসিং বা রেলক্রসিং ২ প্রকার।
(ক) রক্ষিত রেলক্রসিং বা পাহারাদার নিয়ন্ত্রিত রেলক্রসিং,
(খ) অরক্ষিত রেলক্রসিং বা পাহারাদারবিহীন রেলক্রসিং।`},
{n:89, q:`রক্ষিত লেভেলক্রসিংয়ে চালকের কর্তব্য কী?`, a:`গাড়ির গতি কমিয়ে সতর্কতার সাথে সামনে আগাতে হবে। যদি রাস্তা বন্ধ থাকে তাহলে গাড়ি থামাতে হবে, আর খোলা থাকলে ডানেবামে ভালোভাবে দেখে অতিক্রম করতে হবে।`},
{n:90, q:`অরক্ষিত লেভেলক্রসিংয়ে চালকের কর্তব্য কী?`, a:`গাড়ির গতি একদম কমিয়ে সতর্কতার সাথে সামনে আগাতে হবে, প্রয়োজনে লেভেলক্রসিংয়ের নিকট থামাতে হবে। এরপর ডানেবামে দেখে নিরাপদ মনে হলে অতিক্রম করতে হবে।`},
{n:91, q:`বিমানবন্দরের কাছে চালককে সতর্ক থাকতে হবে কেন?`, a:`(ক) বিমানের প্রচন্ড শব্দে গাড়ির চালক হঠাৎ বিচলিত হতে পারেন,
(খ) সাধারণ শ্রবণ ক্ষমতার ব্যাঘাত ঘটতে পারে,
(গ) বিমানবন্দরে ভিভিআইপি/ভিআইপি বেশি চলাচল করে বিধায় এই বিষয়ে সতর্ক থাকতে হয়।`},
{n:92, q:`মোটরসাইকেল চালক ও আরোহীর হেলমেট ব্যবহার করা উচিত কেন?`, a:`মানুষের মাথা শরীরের অন্যান্য অঙ্গের মধ্যে সবচেয়ে বেশি স্পর্শকাতর ও গুরুত্বপূর্ণ একটি অঙ্গ। এখানে সামান্য আঘাত লাগলেই মানুষের মৃত্যু ঘটতে পারে। তাই দুর্ঘটনায় মানুষের মাথাকে রক্ষা করার জন্য হেলমেট ব্যবহার করা উচিত।`},
{n:93, q:`গাড়ির পেছনের অবস্থা পর্যবেক্ষণের জন্য কতক্ষণ পর পর লুকিং গ্লাস দেখতে হবে?`, a:`প্রতিমিনিটে ৬ থেকে ৮ বার।`},
{n:94, q:`পাহাড়ি রাস্তায় কী কী সতর্কতা অবলম্বন করতে হয়?`, a:`সামনের গাড়ি থেকে নিরাপদ দূরত্ব বজায় রেখে ১ নং গিয়ারে বা ফার্স্ট গিয়ারে সতর্কতার সাথে ধীরে ধীরে ওপরে উঠতে হবে। পাহাড়ের চূড়ার কাছে গিয়ে আরো ধীরে উঠতে হবে, কারণ চূড়ায় দৃষ্টিসীমা অত্যন্ত সীমিত। নিচে নামার সময় গাড়ির গতি ক্রমে বাড়তে থাকে বিধায় সামনের গাড়ি থেকে বাড়তি দূরত্ব বজায় রেখে নামতে হবে। ওঠা-নামার সময় কোনোক্রমেই ওভারটেকিং করা যাবে না।`},
{n:95, q:`বৃষ্টির মধ্যে গাড়ি চালনার বিষয়ে কী কী সতর্কতা অবলম্বন করতে হয়?`, a:`বৃষ্টির সময় রাস্তা পিচ্ছিল থাকায় ব্রেক কম কাজ করে। এই কারণে বাড়তি সতর্কতা হিসাবে ধীর গতিতে (সাধারণ গতির চেয়ে অর্ধেক গতিতে) গাড়ি চালাতে হবে, যাতে ব্রেক প্রয়োগ করে অতি সহজেই গাড়ি থামানো যায়। অর্থাৎ ব্রেক প্রয়োগ করে গাড়ি যাতে অতি সহজেই থামানো বা নিয়ন্ত্রণ করা যায়, সেইরূপ ধীর গতিতে বৃষ্টির মধ্যে গাড়ি চালাতে হবে।`},
{n:96, q:`ব্রিজে ওঠার পূর্বে একজন চালকের করণীয় কী?`, a:`ব্রিজ বিশেষকরে উঁচু ব্রিজের অপরপ্রান্ত থেকে আগত গাড়ি সহজে দৃষ্টিগোচর হয় না বিধায় ব্রিজে ওঠার পূর্বে সতর্কতার সাথে গাড়ির গতি কমিয়ে উঠতে হবে। তাছাড়া, রাস্তার তুলনায় ব্রিজের প্রস্থ অনেক কম হয় বিধায় ব্রিজে কখনো ওভারটেকিং করা যাবে না।`},
{n:97, q:`পার্শ্বরাস্তা থেকে প্রধান রাস্তায় প্রবেশ করার সময় কী কী সতর্কতা অবলম্বন করতে হয়?`, a:`পার্শ্বরাস্তা বা ছোট রাস্তা থেকে প্রধান রাস্তায় প্রবেশ করার আগে গাড়ির গতি কমিয়ে, প্রয়োজনে থামিয়ে, প্রধান রাস্তার গাড়িকে নির্বিঘ্নে আগে যেতে দেওয়ার ব্যবস্থা করতে হবে। প্রধান সড়কে গাড়ির গতিবিধি পর্যবেক্ষণ করে সুযোগমত সতর্কতার সাথে প্রধান রাস্তায় প্রবেশ করতে হবে।`},
{n:98, q:`রাস্তার ওপর প্রধানত কী কী ধরনের রোডমার্কিং অঙ্কিত থাকে?`, a:`রাস্তার ওপর প্রধানত ০৩ ধরনের রোডমার্কিং অঙ্কিত থাকে।
(ক) ভাঙালাইন, যা অতিক্রম করা যায়।
(খ) একক অখন্ডলাইন, যা অতিক্রম করা নিষেধ, তবে প্রয়োজনবিশেষ অতিক্রম করা যায়।
(গ) দ্বৈত অখন্ডলাইন, যা অতিক্রম করা নিষেধ এবং আইনত দন্ডনীয়; এই ধরনের লাইন দিয়ে ট্রাফিকআইল্যান্ড বা রাস্তার বিভক্তি বুঝায়।`},
{n:99, q:`জেব্রাক্রসিংয়ে চালকের কর্তব্য কী?`, a:`জেব্রাক্রসিংয়ে পথচারীদের অবশ্যই আগে যেতে দিতে হবে এবং পথচারী যখন জেব্রাক্রসিং দিয়ে পারাপার হবে তখন গাড়িকে অবশ্যই তার আগে থামাতে হবে। জেব্রাক্রসিংয়ের ওপর গাড়ি থামানো যাবে না বা রাখা যাবে না।`},
{n:100, q:`কোন কোন গাড়িকে ওভারটেক করার সুযোগ দিতে হবে?`, a:`যে গাড়ির গতি বেশি, এ্যাম্বুলেন্স, ফায়ার সার্ভিস ইত্যাদি জরুরি সার্ভিস, ভিআইপি গাড়ি ইত্যাদিকে।`},
{n:101, q:`হেড লাইট ফ্ল্যাশিং বা আপার ডিপার ব্যবহারের নিয়ম কী?`, a:`শহরের মধ্যে সাধারণত 'লো-বিম বা ডিপার বা মৃদুবিম' ব্যবহার করা হয়। রাতে কাছাকাছি গাড়ি না থাকলে অর্থাৎ বেশিদূর পর্যন্ত দেখার জন্য হাইওয়ে ও শহরের বাইরের রাস্তায় 'হাই বা আপার বা তীব্র বিম' ব্যবহার করা হয়। তবে, বিপরীতদিক থেকে আগত গাড়ি ১৫০ মিটারের মধ্যে চলে আসলে হাইবিম নিভিয়ে লো-বিম জ্বালাতে হবে। অর্থাৎ বিপরীতদিক হতে আগত কোনো গাড়িকে পাস/পার হওয়ার সময় লো-বিম জ্বালাতে হবে।`},
{n:102, q:`গাড়ির ব্রেক ফেল করলে করণীয় কী?`, a:`গাড়ির ব্রেক ফেল করলে প্রথমে অ্যাক্সিলেটর থেকে পা সরিয়ে নিতে হবে। ম্যানুয়াল গিয়ার গাড়ির ক্ষেত্রে গিয়ার পরিবর্তন করে প্রথমে দ্বিতীয় গিয়ার ও পরে প্রথম গিয়ার ব্যবহার করতে হবে। এর ফলে গাড়ির গতি অনেক কমে যাবে। এই পদ্ধতিতে গাড়ি থামানো সম্ভব না হলে রাস্তার আইল্যান্ড, ডিভাইডার, ফুটপাত বা সুবিধামত অন্যকিছুর সাথে ঠেকিয়ে গাড়ি থামাতে হবে। ঠেকানোর সময় জানমালের ক্ষয়ক্ষতি যেনো না হয় বা কম হয় সেইদিকে সজাগ থাকতে হবে।`},
{n:103, q:`গাড়ির চাকা ফেটে গেলে করণীয় কী?`, a:`গাড়ির চাকা ফেটে গেলে গাড়ি নিয়ন্ত্রণহীন হয়ে পড়ে। এই সময় গাড়ির চালককে স্টিয়ারিং দৃঢ়ভাবে ধরে রাখতে হবে এবং অ্যাক্সিলেটর থেকে পা সরিয়ে ক্রমান্বয়ে গতি কমিয়ে আস্তে আস্তে ব্রেক করে গাড়ি থামাতে হবে। চলন্ত অবস্থায় গাড়ির চাকা ফেটে গেলে সাথে সাথে ব্রেক করবেন না। এতে গাড়ি নিয়ন্ত্রণহীন হয়ে পড়ে।`},
{n:104, q:`হ্যাজার্ড বা বিপদ সংকেত বাতি কী?`, a:`প্রতিটি গাড়ির সামনে ও পিছনে উভয়পাশের কর্ণারে একজোড়া করে মোট দু-জোড়া ইন্ডিকেটর বাতি থাকে। এই চারটি ইন্ডিকেটর বাতি সবগুলো একসাথে জ্বললে এবং নিভলে তাকে হ্যাজার্ড বা বিপদ সংকেত বাতি বলে। বিপজ্জনক মুহূর্তে, গাড়ি বিকল হলে এবং দুর্যোগপূর্ণ আবহাওয়ায় এই বাতিগুলো ব্যবহার করা হয়।`},
{n:105, q:`গাড়ির ড্যাশবোর্ডে কী কী ইনস্ট্রুমেন্ট থাকে?`, a:`(ক) স্পিডোমিটার - গাড়ি কত বেগে চলছে তা দেখায়।
(খ) ওডোমিটার - তৈরির প্রথম থেকে গাড়ি কত কিলোমিটার বা মাইল চলছে তা দেখায়।
(গ) ট্রিপমিটার - এক ট্রিপে গাড়ি কত কিলোমিটার/মাইল চলে তা দেখায়।
(ঘ) টেম্পারেচার গেজ - ইঞ্জিনের তাপমাত্রা দেখায়।
(ঙ) ফুয়েল গেজ - গাড়ির তেলের পরিমাণ দেখায়।`},
{n:106, q:`গাড়িতে কী কী লাইট থাকে?`, a:`(ক) হেডলাইট
(খ) পার্কলাইট
(গ) ব্রেকলাইট
(ঘ) রিভার্সলাইট
(ঙ) ইন্ডিকেটরলাইট
(চ) ফগ লাইট
(ছ) নাম্বারপ্লেট লাইট।`},
{n:107, q:`গাড়ির সামনে ও পিছনে লাল রঙের ইংরেজি L অক্ষরটি বড় আকারে লেখা থাকলে এর দ্বারা কী বুঝায়?`, a:`এটি একটি শিক্ষানবিশ ড্রাইভার চালিত গাড়ি। এই গাড়ি হতে সাবধান থাকতে হবে।`},
{n:108, q:`শিক্ষানবিশ ড্রাইভিং লাইসেন্স দিয়ে গাড়ি চালানো বৈধ কী?`, a:`ইনসট্রাক্টরের উপস্থিতিতে ডুয়েল সিস্টেম (ডাবল স্টিয়ারিং ও ব্রেক) সম্বলিত গাড়ি নিয়ে সামনে ও পিছনে "L" লেখা প্রদর্শন করে নির্ধারিত এলাকায় চালানো বৈধ।`},
{n:109, q:`ফোরহুইল ড্রাইভ গাড়ি বলতে কী বুঝায়?`, a:`সাধারণত ইঞ্জিন হতে গাড়ির পেছনের দু-চাকায় পাওয়ার (ক্ষমতা) সরবরাহ হয়ে থাকে। বিশেষ প্রয়োজনে যে গাড়ির চারটি চাকায় (সামনের ও পিছনের) পাওয়ার সরবরাহ করা হয়, তাকে ফোরহুইল ড্রাইভ গাড়ি বলে।`},
{n:110, q:`ফোরহুইল ড্রাইভ কখন প্রয়োগ করতে হয়?`, a:`ভালো রাস্তাতে চলার সময় শুধুমাত্র পেছনের দু-চাকাতে ড্রাইভ দেওয়া হয়। কিন্তু পিচ্ছিল, কর্দমাক্ত রাস্তায় চলার সময় চার চাকাতে ড্রাইভ দিতে হয়।`},
{n:111, q:`টুলবক্স কী?`, a:`টুলবক্স হচ্ছে যন্ত্রপাতির বাক্স, যা গাড়ির সঙ্গে রাখা হয়। মোটরযান জরুরি মেরামতের জন্য প্রয়োজনীয় যন্ত্রপাতি ও মালামাল টুলবক্সে রাখা হয়।`},
{n:112, q:`ফুয়েল গেজের কাজ কী?`, a:`ফুয়েল বা জ্বালানি ট্যাংকে কী পরিমাণ জ্বালানি আছে তা ফুয়েল গেজের মাধ্যমে জানা যায়।`},
{n:113, q:`গাড়ি রাস্তায় চলার সময় হঠাৎ ইঞ্জিন বন্ধ হয়ে গেলে প্রথমে কী চেক করতে হবে?`, a:`ফুয়েল বা জ্বালানি আছে কি না চেক করতে হবে।`},
{n:114, q:`পেট্রোল ইঞ্জিন স্টার্ট করতে ব্যর্থ হলে কোন দুটি প্রধান বিষয় চেক করতে হয়?`, a:`(ক) প্লাগ পয়েন্টে ঠিকভাবে স্পার্ক হচ্ছে কি না চেক করতে হয়।
(খ) কার্বুরেটরে পেট্রোল যাচ্ছে কি না চেক করতে হয়।`},
{n:115, q:`ফুয়েল ও অয়েল বলতে কী বুঝায়?`, a:`ফুয়েল বলতে জ্বালানি অর্থাৎ পেট্রোল, অকটেন, সিএনজি, ডিজেল ইত্যাদি বুঝায় এবং অয়েল বলতে লুব্রিকেটিং অয়েল বা লুব অয়েল বা মবিল বুঝায়।`},
{n:116, q:`অয়েল (মবিল) এর কাজ কী?`, a:`ইঞ্জিনের বিভিন্ন ওয়ার্কিংপার্টস (যন্ত্রাংশ) সমূহকে ঘুরতে বা নড়াচড়া করতে সাহায্য করা, ক্ষয়হতে রক্ষা করা এবং ইঞ্জিন পার্টস সমূহকে ঠান্ডা ও পরিষ্কার রাখা মবিলের কাজ।`},
{n:117, q:`কম মবিল বা লুব অয়েলে ইঞ্জিন চালালে কী ক্ষতি হয়?`, a:`বিয়ারিং অত্যধিক গরম হয়ে গলে যেতে পারে এবং পিস্টন সিলিন্ডার জ্যাম বা সিজড্ হতে পারে।`},
{n:118, q:`অয়েল (মবিল) কেন এবং কখন বদলানো উচিত?`, a:`দীর্ঘদিন ব্যবহারে মবিলে ইঞ্জিনের কার্বন, ক্ষয়িত ধাতু, ফুয়েল, পানি ইত্যাদি জমার কারণে এর গুণাগুণ নষ্ট হয়ে যায় বিধায় মবিল বদলাতে হয়। গাড়ি প্রস্তুতকারক প্রদত্ত ম্যানুয়াল/হ্যান্ডবুকের নির্দেশ মোতাবেক নির্দিষ্ট মাইল/কিলোমিটার চলার পর মবিল বদলাতে হয়।`},
{n:119, q:`লুব অয়েল (মবিল) কোথায় দিতে হয়?`, a:`ইঞ্জিনের ওপরের অংশে হেড কভার বা ট্যাপেট কভারের নির্ধারিত পোর্টে ক্যাপ খুলে মবিল দিতে হয়।`},
{n:120, q:`ইঞ্জিনে অয়েল (মবিল) এর পরিমাণ কিসের সাহায্যে পরীক্ষা করা হয়?`, a:`ডিপস্টিক এর সাহায্যে।`},
{n:121, q:`কখন ক্লাচে চাপ দিতে হয়?`, a:`(ক) গিয়ার পরিবর্তন করার সময়।
(খ) ব্রেক করার সময় যদি গাড়ি থেমে যেতে চায় বা থামাতে হয়।`},
{n:122, q:`টায়ার প্রেসার বেশি বা কম হলে কী অসুবিধা হয়?`, a:`টায়ার প্রেসার বেশি বা কম হওয়া কোনটিই ভালো নয়। টায়ার প্রেসার বেশি হলে মাঝখানে বেশি ক্ষয়প্রাপ্ত হয়, আবার টায়ার প্রেসার কম হলে দু-পাশে বেশি ক্ষয়প্রাপ্ত হয়। ফলে টায়ার তাড়াতাড়ি নষ্ট হয়ে যায়।`},
{n:123, q:`কোন নির্দিষ্ট টায়ারের প্রেসার কত হওয়া উচিত তা কীভাবে জানা যায়?`, a:`টায়ারের আকার (size), ধরন (type) ও বোঝা (Load) বহন ক্ষমতার ওপর নির্ভর করে প্রস্তুতকারক কর্তৃক সঠিক প্রেসার নির্ধারণ করা হয়, যা প্রস্তুতকারকের হ্যান্ডবুক/ম্যানুয়ালে উল্লেখ থাকে।`},
{n:124, q:`গাড়ি না চালালে টায়ার কী করা উচিত?`, a:`গাড়ি দীর্ঘসময়ের জন্য না চালালে টায়ার খুলে ঠান্ডা স্থানে দাঁড় করিয়ে রাখা উচিত। অল্পসময়ের জন্য হলে চাকাগুলি মাটি হতে ওপরে উঠিয়ে রাখা উচিত অথবা মাঝে মাঝে হাওয়া দেওয়া উচিত।`},
{n:125, q:`টায়ার রোটেশন কী?`, a:`বিভিন্ন কারণে গাড়ির সবগুলো টায়ারের ক্ষয় সমহারে হয় না। গাড়ির চাকাগুলোর ক্ষয়ের সমতা রক্ষার জন্য একদিকের টায়ার খুলে অপরদিকে কিংবা সামনের টায়ার খুলে পেছনে লাগানোকে অর্থাৎ টায়ারের স্থান পরিবর্তন করে ঘুরিয়ে ঘুরিয়ে লাগানোর পদ্ধতিকেই টায়ার রোটেশন বলে। এর ফলে টায়ারের আয়ু বহুলাংশে বেড়ে যায়।`},
{n:126, q:`ব্যাটারির কাজ কী?`, a:`(ক) ইঞ্জিনকে চালু করতে সহায়তা করা।
(খ) পেট্রোল ইঞ্জিনের ইগনিশন সিস্টেমে কারেন্ট সরবরাহ করা।
(গ) সকল প্রকার লাইট জ্বালাতে এবং মিটারসমূহ চালাতে সহায়তা করা।
(ঘ) হর্ণ বাজাতে সাহায্য করা।`},
{n:127, q:`নিয়মিত ব্যাটারির কী পরীক্ষা করা উচিত?`, a:`পানির লেভেল।`},
{n:128, q:`সময় ও প্রয়োজনমতো ব্যাটারিতে ডিস্টিল্ড ওয়াটার না দিলে কী হয়?`, a:`ব্যাটারি ক্যাপাসিটি কমে যায় এবং প্লেট নষ্ট হয়ে যেতে পারে।`},
{n:129, q:`ব্যাটারির টার্মিনাল হতে মরিচা দূর করা হয় কেন?`, a:`মরিচা সন্তোষজনক বৈদ্যুতিক সংযোগে বাধা দেয় এবং কালক্রমে টার্মিনালের ভিতর দিয়ে মরিচা পড়ে ও সম্পূর্ণ টার্মিনাল নষ্ট হয়ে যায়।`},
{n:130, q:`মরিচা পরিষ্কার করার পর টার্মিনালে কী করা উচিত?`, a:`গ্রিজ লাগানো উচিত।`},
{n:131, q:`মোটরগাড়িতে ব্যবহৃত ব্যাটারির ভোল্টেজ কত থাকে?`, a:`৬ ভোল্ট এবং ১২ ভোল্ট থাকে। (বড় ট্রাকে এবং বাসে ২৪ ভোল্টের ব্যাটারিও ব্যবহৃত হয়ে থাকে)।`}
];

</script>
<script>
  const KEY = 'brta-progress-v1';
  let progress = JSON.parse(localStorage.getItem(KEY) || '{}'); // {n: 'k'|'d'}
  let mode = 'all', order = CARDS.map(c => c.n), pos = 0, flipped = false;
  const byN = Object.fromEntries(CARDS.map(c => [c.n, c]));
  const $ = id => document.getElementById(id);

  function save() { localStorage.setItem(KEY, JSON.stringify(progress)); }

  function pool() {
    return order.filter(n =>
      mode === 'all' ? true :
      mode === 'miss' ? progress[n] === 'd' :
      progress[n] === undefined);
  }

  function render() {
    $('show').textContent = flipped ? '↩ প্রশ্নে ফিরুন / Back to question' : '👁 উত্তর দেখুন / Show answer';
    const p = pool();
    if (pos >= p.length) pos = Math.max(0, p.length - 1);
    const known = Object.values(progress).filter(v => v === 'k').length;
    const miss  = Object.values(progress).filter(v => v === 'd').length;
    $('stats').textContent = `জানি: ${known} • ভুল: ${miss} • বাকি: ${CARDS.length - known - miss} • মোট ${CARDS.length}টি`;
    const card = $('card');
    if (!p.length) {
      card.className = ''; card.innerHTML = '<div class="body">এই তালিকায় কোনো কার্ড নেই 🎉</div>'; return;
    }
    const c = byN[p[pos]];
    card.className = flipped ? 'ans' : '';
    card.innerHTML = `<div class="tag">প্রশ্ন ${c.n} • ${pos + 1}/${p.length} • ${flipped ? 'উত্তর' : 'প্রশ্ন'}</div>
                      <div class="body"></div>`;
    card.querySelector('.body').textContent = flipped ? c.a : c.q;
  }

  function move(d) { const p = pool(); if (!p.length) return; pos = (pos + d + p.length) % p.length; flipped = false; render(); }
  function mark(v) {
    const p = pool(); if (!p.length) return;
    progress[p[pos]] = v; save();
    if (mode !== 'all') { flipped = false; render(); } else move(1);
  }
  function setMode(m) {
    mode = m; pos = 0; flipped = false;
    ['mAll','mMiss','mNew'].forEach(id => $(id).classList.remove('on'));
    $(m === 'all' ? 'mAll' : m === 'miss' ? 'mMiss' : 'mNew').classList.add('on');
    render();
  }

  $('card').onclick = () => { flipped = !flipped; render(); };
  $('show').onclick = () => { flipped = !flipped; render(); };
  $('prev').onclick = () => move(-1);
  $('next').onclick = () => move(1);
  $('know').onclick = () => mark('k');
  $('dont').onclick = () => mark('d');
  $('mAll').onclick = () => setMode('all');
  $('mMiss').onclick = () => setMode('miss');
  $('mNew').onclick = () => setMode('new');
  $('shuf').onclick = () => { order.sort(() => Math.random() - 0.5); pos = 0; flipped = false; render(); };
  $('jump').onchange = e => {
    const n = +e.target.value, i = pool().indexOf(n);
    if (i >= 0) { pos = i; flipped = false; render(); }
  };
  $('reset').onclick = () => {
    if (confirm('সব অগ্রগতি মুছে ফেলবেন?')) { progress = {}; save(); setMode('all'); }
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); flipped = !flipped; render(); }
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'ArrowLeft') move(-1);
  });
  render();
</script>
</body>
</html>
